apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: guestbook-pubsub
spec:
  # Swap for pubsub.azure.servicebus.topics, pubsub.kafka, ... without code changes.
  type: pubsub.redis
  version: v1
  metadata:
    - name: redisHost
      value: localhost:6379
    - name: redisPassword
      value: ""
scopes:
  - guestbook-frontend
  - guestbook-worker
